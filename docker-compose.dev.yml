version: '3.8'

services:
  open-webui-dev:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: open-webui-dev
    ports:
      - "3001:8080"
    volumes:
      - open-webui-dev-data:/app/backend/data
    environment:
      - WEBUI_NAME=Open WebUI Dev
      - ENV=dev
    restart: unless-stopped
    networks:
      - open-webui-dev-network

volumes:
  open-webui-dev-data:
    name: open-webui-dev-data

networks:
  open-webui-dev-network:
    name: open-webui-dev-network
